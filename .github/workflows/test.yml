name: LEXFLOW Continuous Integration Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Execute TypeScript Type Check
        run: npm run lint

      - name: Execute Vitest Suite with V8 Coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: Execute Production Bundle Build
        run: npm run build
